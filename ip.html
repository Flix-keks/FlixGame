
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weihnachts Server</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: linear-gradient(135deg, #071b38, #123d59, #40145c);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

/* Schnee */
.snow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
}

.flake {
    position: absolute;
    top: -20px;
    color: white;
    animation: snowfall linear infinite;
    opacity: 0.8;
}

@keyframes snowfall {
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

/* Weihnachtsmann und Schlitten */
.santa {
    position: fixed;
    top: 12%;
    left: -550px;
    font-size: 55px;
    white-space: nowrap;
    z-index: 2;
    animation: santaRide 18s linear infinite;
    filter: drop-shadow(0 0 12px white);
}

@keyframes santaRide {
    0% {
        left: -550px;
        transform: translateY(0);
    }
    45% {
        transform: translateY(-25px);
    }
    55% {
        transform: translateY(10px);
    }
    100% {
        left: 110%;
        transform: translateY(0);
    }
}

/* Hauptbereich */
.content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    color: white;
    font-family: Arial, sans-serif;
    position: relative;
    z-index: 3;
    padding: 20px;
}

h1 {
    color: #00ffff;
    text-shadow: 0 0 15px cyan;
}

button {
    display: flex;
    align-items: center;
    gap: 10px;
    background: black;
    color: rgb(0, 255, 255);
    border: 2px solid cyan;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 16px;
    box-shadow: 0 0 10px cyan;
    transition: all 0.3s ease;
    cursor: pointer;
}

button:hover {
    box-shadow: 0 0 10px cyan, 0 0 40px cyan;
    transform: scale(1.05);
}

button img {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
}

.home {
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 10px 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ff3b30, #00e5ff);
    color: white;
    text-decoration: none;
    font-weight: 700;
    z-index: 5;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
}

@media(max-width: 600px) {
    button {
        font-size: 14px;
    }

    .santa {
        font-size: 38px;
    }
}
</style>
</head>

<body>

<div class="snow" id="snow"></div>

<!-- Weihnachtsmann mit Rentieren -->
<div class="santa">
    🦌 🦌 🦌 🎅🛷
</div>

<a href="index.html" class="home">Home</a>

<div class="content">

    <h1>🎄 Weihnachts Server 🎄</h1>

    <p style="font-size:20px;text-align:center;">
        Klicke auf einen Button, um die IP zu öffnen.
        <br>
        Frohe Weihnachten! ❄️
    </p>

    <div class="buttons">

        <button onclick="window.open('https://supperrr.g-portal.game','_blank')">
            🌐 IP: Supperrr.g-portal.game
        </button>

        <button onclick="window.open('https://heldeninsel.net','_blank')">
            🛡️ IP: Heldeninsel.net
        </button>

        <button onclick="window.open('https://boocord.com','_blank')">
            💬 IP: Boocord.com
        </button>

        <button onclick="window.open('https://example.com','_blank')">
            🎁 IP: Coming Soon
        </button>

    </div>
</div>

<script>
// Schnee erzeugen
const snow = document.getElementById("snow");

for (let i = 0; i < 100; i++) {
    const flake = document.createElement("div");

    flake.className = "flake";
    flake.innerHTML = "❄";

    flake.style.left = Math.random() * 100 + "%";
    flake.style.fontSize = (Math.random() * 15 + 8) + "px";
    flake.style.animationDuration = (Math.random() * 8 + 5) + "s";
    flake.style.animationDelay = Math.random() * 10 + "s";

    snow.appendChild(flake);
}
</script>

</body>
</html>
